name        = "mongo_countries"
description = "countries of the world -> mongodb collection countries"

[[sources]]
id        = "files"
type      = "local"
mode      = "full_refresh"
path      = "/Users/tej/Documents/zysec/openetl-workspace/openetl-data-lab/downloads/json-items/countries"
filter    = "*.json"
recursive = true

[[transforms]]
type     = "extract"
strategy = "fast"
entities = false

[[sinks]]
id         = "out"
type       = "mongodb"
write_mode = "append"
collection = "countries"
uri        = "mongodb://127.0.0.1:27017"
database   = "openetl"
