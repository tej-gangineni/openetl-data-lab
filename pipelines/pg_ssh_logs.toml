name        = "pg_ssh_logs"
description = "OpenSSH server auth log (loghub) -> postgres table ssh_logs"

[[sources]]
id        = "files"
type      = "local"
mode      = "full_refresh"
path      = "/Users/tej/Documents/zysec/openetl-workspace/openetl-data-lab/downloads/logs-parts/SSH"
filter    = "*.log"
recursive = true

[[transforms]]
type     = "extract"
strategy = "fast"
entities = false

[[sinks]]
id         = "out"
type       = "postgres"
write_mode = "append"
table      = "ssh_logs"
dsn        = "postgresql://lab:lab@127.0.0.1:5433/openetl"
