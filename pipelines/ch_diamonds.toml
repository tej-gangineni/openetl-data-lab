name        = "ch_diamonds"
description = "diamonds price table, 54k rows -> clickhouse table diamonds"

[[sources]]
id        = "files"
type      = "local"
mode      = "full_refresh"
path      = "/Users/tej/Documents/zysec/openetl-workspace/openetl-data-lab/downloads/csv/diamonds"
filter    = "*.csv"
recursive = true

[[transforms]]
type     = "extract"
strategy = "fast"
entities = false

[[sinks]]
id         = "out"
type       = "clickhouse"
write_mode = "append"
table      = "diamonds"
host       = "127.0.0.1"
port       = 8123
database   = "openetl"
username   = "lab"
password   = "lab"
